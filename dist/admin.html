<!doctype html>
<html lang="id">

    <link rel="stylesheet" href="/styles.css?v=10" />

  </head>
  <body class="admin-page">
    <a class="skip-link" href="#admin-content">Lewati ke konten admin</a>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand"><a href="/?v=10" aria-label="Radius Society home"><img src="/assets/radius-logo.jpg" alt="Radius Society" width="40" height="40" /></a><div><strong>RADIUS</strong><span>Administration</span></div><button class="admin-menu" type="button" aria-controls="admin-nav" aria-expanded="false">Menu admin</button></div>
